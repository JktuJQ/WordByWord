plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.wordbyword.app'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        // Initial development identifiers; revisit before publishing.
        applicationId 'dev.wordbyword.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
