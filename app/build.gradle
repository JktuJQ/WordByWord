tasks.register('prepareDiarizationEmbeddingCandidates') {
    dependsOn('prepareDiarizationModels')

    def baselineEmbeddingCopy = new File(embeddingCandidatesAssetsDir, 'baseline_embedding.onnx')
    def segmentationCopy = new File(embeddingCandidatesAssetsDir, 'segmentation.int8.onnx')

    onlyIf {
        !(embeddingCandidates.values().every { new File(embeddingCandidatesAssetsDir, it.fileName).exists() } &&
            baselineEmbeddingCopy.exists() && segmentationCopy.exists())
    }

    doLast {
        embeddingCandidatesDownloadDir.mkdirs()
        embeddingCandidatesAssetsDir.mkdirs()

        embeddingCandidates.each { key, artifact ->
            def downloaded = new File(embeddingCandidatesDownloadDir, artifact.fileName)
            if (!downloaded.exists() || sha256Of(downloaded) != artifact.sha256) {
                logger.lifecycle("Downloading ${artifact.fileName}")
                ant.get(src: artifact.url, dest: downloaded, verbose: false)
            }
            def actualSha256 = sha256Of(downloaded)
            if (actualSha256 != artifact.sha256) {
                throw new GradleException(
                    "Checksum mismatch for ${artifact.fileName}: expected ${artifact.sha256}, got ${actualSha256}")
            }
        }

        copy {
            from(embeddingCandidatesDownloadDir)
            into embeddingCandidatesAssetsDir
        }

        copy {
            from(diarizationAssetsDir) {
                include 'embedding.onnx'
                rename { 'baseline_embedding.onnx' }
            }
            from(diarizationAssetsDir) {
                include 'segmentation.int8.onnx'
            }
            into embeddingCandidatesAssetsDir
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn('prepareDiarizationModels')
    dependsOn('prepareAsrModels')
    dependsOn('prepareDiarizationEmbeddingCandidates')
}
