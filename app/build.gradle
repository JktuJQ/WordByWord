plugins {
    id 'com.android.application'
}

android {
    namespace = 'dev.wordbyword.app'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'dev.wordbyword.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation files('vendor/sherpa-onnx-2.0.1.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly files(androidComponents.sdkComponents.sdkDirectory.map {
        it.file("build-tools/${android.buildToolsVersion}/core-lambda-stubs.jar")
    })
    testImplementation 'junit:junit:4.13.2'
}
