plugins {
    id 'com.android.application'
}

def parallelInference = providers.gradleProperty('parallelInference').orElse('true').get()
if (!(parallelInference in ['true', 'false'])) {
    throw new GradleException('parallelInference must be true or false')
}

android {
    buildFeatures { buildConfig = true }
    namespace = 'dev.wordbyword.app'
    compileSdk = 36
    buildToolsVersion = '36.0.0'

    defaultConfig {
        applicationId = 'dev.wordbyword.app'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'PARALLEL_INFERENCE', parallelInference
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDir(layout.buildDirectory.dir('generated/summaryAssets'))
        androidTest {
            java.srcDirs = ['src/testAndroid/java']
            assets.srcDirs = [
                'src/testAndroid/assets',
                '../evaluation/fixtures/diarization',
                '../evaluation/fixtures/asr',
                '../evaluation/fixtures/dialogs/audio',
                '../evaluation/fixtures/asr-native-rate/audio'
            ]
        }
    }
}

dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.17.1'
    implementation 'com.google.code.gson:gson:2.15.0'
    implementation files('vendor/sherpa-onnx-2.0.1.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.2.0'
    compileOnly files(androidComponents.sdkComponents.sdkDirectory.map {
        it.file("build-tools/${android.buildToolsVersion}/core-lambda-stubs.jar")
    })
    testImplementation 'junit:junit:4.13.2'
    testImplementation project(':evaluation')
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'com.google.code.gson:gson:2.15.0'
}

tasks.register('benchmarkAsr', JavaExec) {
    group = 'verification'
    description = 'Run the ASR comparison on desktop using local sherpa-onnx JNI libraries'
    dependsOn('compileDebugUnitTestJavaWithJavac')
    mainClass = 'dev.wordbyword.app.evaluation.RunAsr'
    workingDir = rootProject.projectDir
    doFirst {
        def compiled = tasks.named('compileDebugUnitTestJavaWithJavac').get()
        classpath = files(compiled.destinationDirectory, compiled.classpath)
        def nativeDir = rootProject.file(providers.gradleProperty('asrNativeDir').getOrElse(
            'local-models/asr-eval/sherpa-onnx-v2.0.1-linux-x64-jni/lib'))
        if (!new File(nativeDir, System.mapLibraryName('sherpa-onnx-jni')).isFile()) {
            throw new GradleException('Provide sherpa-onnx 2.0.1 desktop JNI libraries via -PasrNativeDir')
        }
        systemProperty('java.library.path', nativeDir.absolutePath)
    }
}

apply from: 'gradle/models.gradle'
apply from: 'gradle/distribution.gradle'
