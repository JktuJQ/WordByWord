name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          cache-provider: basic

      - name: Cache diarization model downloads
        id: diarization-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /tmp/diarization-downloads
          key: diarization-models-${{ hashFiles('app/prepare-diarization-models.py') }}

      - name: Download diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/diarization-downloads
          curl -sL -o /tmp/diarization-downloads/sherpa-onnx-2.0.1.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar
          curl -sL -o /tmp/diarization-downloads/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          curl -sL -o "/tmp/diarization-downloads/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_eres2net_base_sv_zh-cn_3dspeaker_16k.onnx"

      - name: Prepare diarization models
        run: python3 app/prepare-diarization-models.py /tmp/diarization-downloads

      - name: Build, test and lint
        run: ./gradlew --no-daemon --stacktrace --continue testDebugUnitTest assembleDebug lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: wordbyword-debug-${{ github.run_number }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-reports-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/test-results/testDebugUnitTest/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14
