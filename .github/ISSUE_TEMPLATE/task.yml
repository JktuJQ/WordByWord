name: Task
description: A feature, shared component, investigation, or infrastructure task
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - MVP
        - Post-MVP extension
        - Infrastructure and process
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Problem and expected outcome
      description: What outcome is needed, and who benefits?
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries
      description: What is included, and what remains out of scope?
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and existing interfaces
      description: Link Issues, PRs, shared types, and contracts. Explicitly state if there are no dependencies.
      placeholder: "Depends on #1. Uses interface ...; contract changes are coordinated with ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable outcomes required to accept the task.
      placeholder: "- [ ] The user can ...\n- [ ] After restarting ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation method
      description: Commands, workflow, test data, and device if needed.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Before starting, assign one owner in Assignees and select a Project status.
        Implement on a separate branch; reference this Issue, validation, and limitations in the PR.
