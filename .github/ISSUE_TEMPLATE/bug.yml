name: Bug
description: A reproducible build or application behavior problem
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and impact
      description: What is broken, and which workflow does it block?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. Tap ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit or APK version, phone/emulator, and Android version; for build failures, include the OS, JDK, and command. For ML, include model and runtime versions.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and supporting details
      description: Stack trace, screenshot or test recording description, related Issues/PRs, and any known workaround.
  - type: textarea
    id: acceptance
    attributes:
      label: Fix validation
      description: What result should repeating these steps produce?
    validations:
      required: true
