name: Ошибка
description: Воспроизводимая проблема в сборке или поведении приложения
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Проблема и её влияние
      description: Что сломалось и какой сценарий это блокирует?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения
      placeholder: "1. Открыть ...\n2. Выбрать ...\n3. Нажать ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Окружение
      description: Commit или версия APK, телефон/эмулятор и Android; для ошибки сборки — ОС, JDK и команда. Для ML — версии моделей и runtime.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Логи и дополнительные сведения
      description: Стек ошибки, скриншот или описание тестовой записи, связанные Issues/PR и известный обходной путь.
  - type: textarea
    id: acceptance
    attributes:
      label: Как проверить исправление
      description: Какой результат должен получиться после повторения шагов?
    validations:
      required: true
